# raw_transcript.txt as a live demo script. Existing narration is verbatim; stage directions became actions,
# and a direction-only part got a short purpose bridge with its actions anchored to its words (at_word).
# The app has no data-testids yet, so selectors use roles/text verified against the live app.
# Zoom regions are CSS pixels of the 1280x720 kiosk viewport.
title: Procure-to-Pay Agentic Assistant
url: https://procure2pay-fe.bravesky-d9f9eeb7.eastus2.azurecontainerapps.io/
voice: af_sky
speed: 1.1
fps: 30
music:
  file: ../../music/corporate.mp3
  volume_db: -30
pacing:
  gap: 0.7
  action_timeout: 30
style:
  zoom_max: 1.45
  intro_subtitle: "Agentic assistant: end-to-end walkthrough"
  outro_subtitle: "Requisition to accrual, in one conversation"

segments:
  - id: cold-open
    say: >-
      Procure-to-pay is where enterprises quietly lose millions of hours. One purchase crosses a dozen disconnected
      systems — Coupa, Oracle, SharePoint, Remedy — and a chain of hand-offs: raise the requisition, onboard the
      supplier, sign the contract, cut the PO, receive goods, match the invoice, clear holds, pay, accrue, and report.
      Every step is a form, an email, an approval, or a wait.

  - id: assistant
    say: >-
      This is an agentic P2P assistant. You don't need to learn ten different screens — you just chat. Behind that
      chat is a roster of specialist agents that run the entire procure-to-pay lifecycle, call the real systems of
      record, and stop for a human exactly at the points that require approval. One conversation, from requisition
      to accrual.

  - id: agents
    say: >-
      You can see that each stage has its own agent — Requisition, Supplier, Contract, PO, Goods Receipt, Invoice with
      three-way match, Holds, Payment, Urgent Payments, Accruals, and Reporting — coordinated by a supervisor that
      reads the user's intent and routes it to the appropriate specialist. They all read and write to the same case,
      so the requisition you raise and the invoice you pay months later remain one connected thread, not eleven
      separate silos.
    actions:
      - click: { role: link, name: Agents, zoom: false }
      - scroll_to: { text: "PO Management Agent", exact: true, align: top, at_word: PO, until_word: Invoice }
      - scroll_to: { text: "Invoice Holds Agent", exact: true, align: top, at_word: Invoice, until_word: Holds }

  # Direction-only part of the transcript: a short bridge says the purpose (never "click Chat, type ..."), and the
  # actions land on the words that name them. The typed prompt is not read aloud; the next segment narrates the result.
  - id: raise-pr-type
    say: >-
      Let's ask the assistant to raise a purchase requisition for new laptops.
    actions:
      - click: { role: link, name: Chat, zoom: false, at_word: ask }
      - click: { role: button, name: Start new conversation }
      - fill: { role: textbox, nth: last, value: "Create a PR for 500 laptops from Dell at $1,200 each",
                at_word: requisition }
      - press: Enter
      - wait_for: { role: button, name: Approve, nth: last, timeout: 120 }

  - id: raise-pr
    say: >-
      The assistant reads the intent and extracts the vendor, quantity, and amount. Because six hundred thousand
      dollars is above the auto-approval ceiling, the assistant pauses and asks for approval directly in the chat.
    actions:
      - hover: { role: button, name: Approve, nth: last, at_word: approval }

  - id: approve-pr
    say: >-
      Notice that the assistant now provides the next steps as one-tap action buttons. It's guiding the flow instead
      of requiring the user to memorize the process.
    actions:
      - click: { role: button, name: Approve, nth: last, zoom: [270, 120, 990, 480] }
      - wait_for: { role: button, name: Onboard supplier, nth: last, timeout: 120 }
      - hover: { role: button, name: Onboard supplier, nth: last, at_word: one-tap, zoom: [270, 120, 990, 480] }

  - id: onboard-supplier
    say: >-
      The supplier is onboarded against the document checklist. The contract is then drafted as a statement of work.
    actions:
      - click: { role: button, name: Onboard supplier, nth: last, zoom: [270, 120, 990, 480] }
      - click: { role: button, name: Sign the contract, nth: last, timeout: 120, at_word: contract,
                 zoom: [270, 120, 990, 480] }
      - wait_for: { text: "needs sign-off", nth: last, timeout: 120 }

  - id: sign-contract
    say: >-
      Signing is always human-in-the-loop, so the assistant pauses again for approval.
    actions:
      - click: { role: button, name: Approve, nth: last, at_word: approval, zoom: [270, 120, 990, 480] }

  - id: create-po
    say: >-
      Now the assistant asks to create the purchase order. The PO is created from the existing case.
    actions:
      - click: { role: button, name: Create the PO, nth: last, timeout: 120, at_word: purchase order,
                 zoom: [270, 120, 990, 480] }
      - click: { role: button, name: Receive goods, nth: last, timeout: 120, zoom: [270, 120, 990, 480] }

  - id: receive-invoice
    say: >-
      The invoice goes through a real three-way match between the purchase order, goods receipt, and invoice amount.
      The match clears successfully. If it did not, the system would raise a hold and route it to the appropriate
      business owner.
    actions:
      - click: { role: button, name: Process invoice, nth: last, timeout: 120, zoom: [270, 120, 990, 480] }
      - wait_for: { text: "3-way match", nth: last, timeout: 120 }

  - id: payment-accrual
    say: >-
      Payment is scheduled and then settles during the next payment check. The monthly accrual for finance close is
      drafted and confirmed with one tap. The report is generated and logged. From requisition to accrual, the entire
      process happens through one conversation in about a minute.
    actions:
      - click: { role: button, name: Check payment, nth: last, timeout: 120, zoom: [270, 120, 990, 480] }
      - wait_for: { text: "will settle", nth: last, timeout: 120 }
      - click: { role: button, name: Log accrual, nth: last, timeout: 120, at_word: accrual,
                 zoom: [270, 120, 990, 480] }
      - wait_for: { text: "confirm to log it", nth: last, timeout: 120 }
      - click: { role: button, name: Approve, nth: last, at_word: confirmed, zoom: [270, 120, 990, 480] }
      - click: { role: button, name: Monthly report, nth: last, timeout: 120, at_word: report,
                 zoom: [270, 120, 990, 480] }

  - id: governance
    say: >-
      Two things make this usable, not just clever. First, it converges. If you ask for a purchase order before a
      contract exists, the assistant does not simply stop. It tells you which cases are ready and what you need to do
      next. Second, control stays with people. Every real decision stops for human approval, and every decision is
      written to the governance log.
    actions:
      - click: { role: link, name: Governance, zoom: false }

  - id: architecture
    say: >-
      This isn't a toy. The agents call Coupa, Oracle, SharePoint, and Remedy through the same interfaces used by the
      real systems, so production endpoints can be configured without changing the overall workflow. State lives in a
      shared datastore, so a conversation can survive a restart and scale across multiple replicas. Long-running
      approvals are modeled as durable workflows, with a fallback so the assistant never simply stops.
    actions:
      - click: { role: link, name: Architecture, zoom: false }
      - scroll: { by: 1200, duration: 6 }
      - scroll: { by: -1200, duration: 4 }

  - id: observability
    say: >-
      Every agent step and model call is also traced in Arize Phoenix. You can see which agent ran, what it decided,
      the latency, and the token usage. There is also a live activity feed and a data-lineage view inside the
      application. When something looks wrong, you don't have to guess. Open the trace and scroll down to inspect the
      details.
    actions:
      - click: { role: link, name: Observability, zoom: false }
      - scroll: { text: "Live Activity Feed", by: 600, duration: 3, at_word: live activity feed }

  - id: close
    say: >-
      Procure-to-pay — eleven agents, every system of record, every approval, and one conversation. The back-office
      process nobody wants to run, run for you.
    actions:
      - click: { role: link, name: Dashboard, zoom: false }
